# Site Settings
locale: "en-US"
title: "Kiran Naseer"
title_separator: "-"
name: &name "Kiran Naseer"
description: &description "PhD Researcher · Federated Learning · Robustness under Distribution Shift · Medical Imaging AI"
url: "https://KiranNaseer-AI.github.io"
baseurl: ""
repository: "KiranNaseer-AI/KiranNaseer-AI.github.io"

# Site Author
author:
  name: "Kiran Naseer"
  avatar: "profile.jpg"
  bio: "PhD Researcher at University of Gujrat. Building FORGE — a framework for diagnosing and stabilising AI under real-world distribution shift."
  location: "Pakistan"
  employer: "University of Gujrat"
  email: "kirannaseer8@gmail.com"
  uri:
  googlescholar: "https://scholar.google.com/citations?user=Ek9e3qwAAAAJ&hl=en"
  github: "KiranNaseer-AI"
  linkedin: "kiran-naseer"
  orcid: "https://orcid.org/0009-0005-5129-8155"

# Reading Files
include:
  - .htaccess
  - _pages
collections:
  _teaching:
    output: true
    permalink: /:collection/:path/
  _publications:
    output: true
    permalink: /:collection/:path/
  _talks:
    output: true
    permalink: /:collection/:path/
  _posts:
    output: true
    permalink: /:collection/:path/
  _portfolio:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Asia/Karachi

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
